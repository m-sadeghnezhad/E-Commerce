<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mohsen Dashboard — production-ready admin dashboard built with React, TypeScript, Tailwind CSS, and Recharts." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Mohsen Dashboard</title>
    <script>
      ;(function () {
        try {
          const storedTheme = localStorage.getItem('mohsen-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : prefersDark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')

          const storedLocale = localStorage.getItem('mohsen-locale')
          const locale = storedLocale === 'fa' || storedLocale === 'en' ? storedLocale : 'en'
          document.documentElement.lang = locale
          document.documentElement.dir = locale === 'fa' ? 'rtl' : 'ltr'
          if (locale === 'fa') {
            document.body.classList.add('font-persian')
          }
        } catch {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
